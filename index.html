
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<meta name="keywords" content="Nurin'sLibrar, Library Management System, Library Login">

<meta name="description" content="Login to Nurin'sLibrar Library Management System to access library management features.">

<meta name="author" content="Nurin">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nurin'sLibrar</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-card">

            <div class="text-center mb-4">

                <!-- Nurin'sLibrar Logo -->
                <img src="logo nurin.png"
                     alt="Nurin'sLibrar Logo"
                     class="login-logo">

                <h1>Nurin'sLibrar</h1>

                <p>Library Management System</p>

                <h5>Welcome Back!</h5>

            </div>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           class="form-control"
                           value="yenyen"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           value="100805"
                           autocomplete="current-password"
                           required>
                </div>

                <p id="errorMessage"
                   class="error-message"
                   aria-live="polite"></p>

                <button type="submit"
                        class="btn login-button w-100">
                    Login
                </button>

            </form>

            <p class="mt-3 text-center">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

            <div class="text-center mt-3">
                <small>All rights reserved © Nurin'sLibrar</small>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
